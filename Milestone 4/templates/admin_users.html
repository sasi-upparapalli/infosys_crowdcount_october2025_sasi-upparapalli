<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin Panel</h2>
                <p>Hello, {{ username }}</p>
            </div>
            <nav class="sidebar-nav">
                <ul style="display:flex; flex-direction:column; gap:12px;">
                    <li><a href="{{ url_for('admin_dashboard') }}" class="sidebar-btn">Dashboard</a></li>
                    <li><a href="{{ url_for('admin_users') }}" class="sidebar-btn">Users</a></li>
                    <li><a href="{{ url_for('admin_zones') }}" class="sidebar-btn">Zones</a></li>
                    <li><a href="{{ url_for('admin_cameras') }}" class="sidebar-btn">Cameras</a></li>
                    <li><a href="{{ url_for('admin_activity_log') }}" class="sidebar-btn">Activity Log</a></li>
                    <li style="margin-top:auto;"><a href="{{ url_for('logout') }}" class="sidebar-btn logout-btn">Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h1>Manage Users</h1>
            </header>

            <div class="content-area">
                <div class="card">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background-color: #f0f0f0;">
                                <th style="padding: 10px; text-align: left;">ID</th>
                                <th style="padding: 10px; text-align: left;">Username</th>
                                <th style="padding: 10px; text-align: left;">Email</th>
                                <th style="padding: 10px; text-align: left;">Role</th>
                                <th style="padding: 10px; text-align: left;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
    {% for user in users %}
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 10px;">{{ user[0] }}</td> <!-- ID -->
        <td style="padding: 10px;">{{ user[1] }}</td> <!-- Username -->
        <td style="padding: 10px;">{{ user[2] }}</td> <!-- Email -->
        <td style="padding: 10px;">
            <span style="background-color: {% if user[3] == 'admin' %}#ff6b6b{% else %}#4ecdc4{% endif %}; color: white; padding: 5px 10px; border-radius: 3px;">
                {{ user[3] }}
            </span>
        </td>
        <td style="padding: 10px; white-space: nowrap;">
            <a href="{{ url_for('admin_edit_user', user_id=user[0]) }}" class="btn edit-btn">Edit</a>
            <form method="POST" action="{{ url_for('admin_delete_user', user_id=user[0]) }}" style="display:inline;" onsubmit="return confirmDelete(this);">
                <button type="submit" class="btn delete-btn">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</tbody>

                    </table>
                </div>
            </div>
        </main>
    </div>
    <script>
function confirmDelete(form) {
    if(confirm('Are you sure you want to delete this user?')) {
        // Submit the form via AJAX to avoid full page reload
        fetch(form.action, {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
            }
        })
        .then(response => response.json())
        .then(data => {
            if(data.message){
                showPopup(data.message);
                // Optionally, remove deleted row or reload page after short delay
                setTimeout(() => window.location.reload(), 1500);
            } else if(data.error){
                alert("Error: " + data.error);
            }
        })
        .catch(err => alert('Request failed: ' + err));
        return false; // Prevent default form submission
    } else {
        return false;
    }
}

function showPopup(message) {
    const popup = document.createElement('div');
    popup.className = 'popup-message';
    popup.textContent = message;
    document.body.appendChild(popup);
    setTimeout(() => document.body.removeChild(popup), 2000);
}
</script>
</body>

</html>
