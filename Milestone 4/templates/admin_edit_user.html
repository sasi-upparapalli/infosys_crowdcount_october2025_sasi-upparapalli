<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin Panel</h2>
                <p>Hello, {{ username }}</p>
            </div>
            <nav class="sidebar-nav">
                <ul style="display:flex; flex-direction:column; gap:12px;">
                    <li><a href="{{ url_for('admin_dashboard') }}" class="sidebar-btn">Dashboard</a></li>
                    <li><a href="{{ url_for('admin_users') }}" class="sidebar-btn">Users</a></li>
                    <li><a href="{{ url_for('admin_zones') }}" class="sidebar-btn">Zones</a></li>
                    <li><a href="{{ url_for('admin_cameras') }}" class="sidebar-btn">Cameras</a></li>
                    <li><a href="{{ url_for('admin_activity_log') }}" class="sidebar-btn">Activity Log</a></li>
                    <li style="margin-top:auto;"><a href="{{ url_for('logout') }}" class="sidebar-btn logout-btn">Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h1>Edit User</h1>
            </header>

            <div class="content-area">
                <div class="card" style="max-width: 500px;">
                    <form method="POST">
                        <div class="form-group">
                            <label>User ID</label>
                            <input type="text" value="{{ user[0] }}" class="form-input" disabled>
                        </div>
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" value="{{ user[1] }}" class="form-input" disabled>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" value="{{ user[2] }}" class="form-input" disabled>
                        </div>
                        <div class="form-group">
                            <label for="role">Role</label>
                            <select name="role" id="role" class="form-select" required>
                                <option value="user" {% if user == 'user' %}selected{% endif %}>User</option>
                                <option value="admin" {% if user == 'admin' %}selected{% endif %}>Admin</option>
                            </select>
                        </div>
                        <button type="submit" class="cta-btn">Save Changes</button>
                        <a href="{{ url_for('admin_users') }}" style="margin-left: 10px; padding: 10px 20px; background-color: #ccc; color: #333; text-decoration: none; border-radius: 5px;">Cancel</a>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
