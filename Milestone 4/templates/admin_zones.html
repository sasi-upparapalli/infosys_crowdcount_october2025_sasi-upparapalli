<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Zones</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin Panel</h2>
                <p>Hello, {{ username }}</p>
            </div>
            <nav class="sidebar-nav">
                <ul style="display:flex; flex-direction:column; gap:12px;">
                    <li><a href="{{ url_for('admin_dashboard') }}" class="sidebar-btn">Dashboard</a></li>
                    <li><a href="{{ url_for('admin_users') }}" class="sidebar-btn">Users</a></li>
                    <li><a href="{{ url_for('admin_zones') }}" class="sidebar-btn">Zones</a></li>
                    <li><a href="{{ url_for('admin_cameras') }}" class="sidebar-btn">Cameras</a></li>
                    <li><a href="{{ url_for('admin_activity_log') }}" class="sidebar-btn">Activity Log</a></li>
                    <li style="margin-top:auto;"><a href="{{ url_for('logout') }}" class="sidebar-btn logout-btn">Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h1>Manage Zones</h1>
            </header>

            <div class="content-area">
                <div class="card">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background-color: #f0f0f0;">
                                <th style="padding: 10px; text-align: left;">ID</th>
                                <th style="padding: 10px; text-align: left;">Label</th>
                                <th style="padding: 10px; text-align: left;">Video Path</th>
                                <th style="padding: 10px; text-align: left;">User</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for zone in zones %}
                            <tr style="border-bottom: 1px solid #ddd;">
                                <td style="padding: 10px;">{{ zone }}</td>
                                <td style="padding: 10px;">{{ zone }}</td>
                                <td style="padding: 10px; word-break: break-all;">{{ zone }}</td>
                                <td style="padding: 10px;">{{ zone }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
