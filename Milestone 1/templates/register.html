<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Crowd Count</title>

  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { margin: 0; background: #f9f9f9; color: #111; display: flex; min-height: 100vh; }
    .container { display: flex; flex: 1; }
    .form-section { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; animation: fadeIn 0.8s ease-in-out; }
    .form-box { width: 100%; max-width: 400px; background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h1 { font-size: 2.2rem; text-align: center; margin-bottom: 0.5rem; }
    p { text-align: center; color: #666; margin-bottom: 1.5rem; }
    
    /* === MESSAGE STYLES (Flask/Jinja2) === */
    .flash-messages {
      list-style: none;
      padding: 0;
      margin-bottom: 1rem;
    }
    .flash-message {
      padding: 1rem;
      border-radius: 10px;
      font-weight: 500;
      text-align: center;
      font-size: 0.9rem;
      background: #f8d7da; /* Error/default style */
      color: #721c24;
      margin-bottom: 10px;
    }
    /* === END MESSAGE STYLES === */
    
    .input-group { position: relative; margin-bottom: 1rem; }
    .input-group input { width: 100%; padding: 14px 16px 14px 44px; border: 1px solid #ccc; border-radius: 50px; font-size: 1rem; background: #f8f8f8; }
    .input-group svg, .input-group img { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); height: 20px; width: 20px; opacity: 0.6; }
    button { width: 100%; padding: 14px; border: none; border-radius: 50px; font-size: 1rem; font-weight: 600; background: #4F46E5; color: white; cursor: pointer; transition: background 0.3s ease; }
    button:hover { background: #3730A3; }
    .text-center { text-align: center; margin-top: 1rem; }
    .social-buttons { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; }
    .social-buttons button { width: 50px; height: 50px; border-radius: 50%; border: 1px solid #ccc; background: white; display: flex; align-items: center; justify-content: center; }
    .social-buttons img, .social-buttons svg { height: 24px; width: 24px; }
    .brand-section { display: none; }
    @media (min-width: 992px) {
      .brand-section { flex: 1; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6366F1, #A5B4FC); animation: slideInLeft 1s ease; }
      .brand-box { background: white; padding: 4rem; border-radius: 30px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
      .brand-box h2:first-child { color: #000; }
      .brand-box h2:last-child { color: #4F46E5; }
      .brand-box h2 { font-size: 3rem; font-weight: 900; margin: 0; }
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-section">
      <div class="form-box">
        <h1>Create Account</h1>
        <p>Register to get started with your account</p>

        <form method="POST">
          {% with messages = get_flashed_messages() %}
            {% if messages %}
              <div class="flash-messages">
                {% for message in messages %}
                  <p class="flash-message">{{ message }}</p>
                {% endfor %}
              </div>
            {% endif %}
          {% endwith %}
          <div class="input-group">
            <img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" alt="user icon" />
            <input type="text" name="username" placeholder="Username" required />
          </div>

          <div class="input-group">
            <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="email icon" />
            <input type="email" name="email" placeholder="Email" required />
          </div>

          <div class="input-group">
            <img src="https://cdn-icons-png.flaticon.com/512/3064/3064155.png" alt="key icon" />
            <input type="password" name="password" placeholder="Password" required />
          </div>

          <div class="input-group">
            <img src="https://cdn-icons-png.flaticon.com/512/3064/3064155.png" alt="key icon" />
            <input type="password" name="confirm_password" placeholder="Confirm Password" required />
          </div>

          <button type="submit">Sign Up</button>

          <div class="text-center">
            <p>Already have an account? 
              <a href="{{ url_for('login') }}" style="color:#4F46E5; text-decoration:none; font-weight:500;">
                Login
              </a>
            </p>
          </div>

          <div class="text-center">
            <p style="color:#666;">Or register with</p>
            <div class="social-buttons">
              <button type="button" onclick="socialRegister('Google')">
                <img src="https://www.google.com/favicon.ico" alt="Google" />
              </button>
              <button type="button" onclick="socialRegister('Facebook')">
                <svg fill="#1877F2" viewBox="0 0 24 24">
                  <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="brand-section">
      <div class="brand-box">
        <h2>CROWD</h2>
        <h2>COUNT</h2>
      </div>
    </div>
  </div>

  <script>
    function socialRegister(provider) {
      alert(`${provider} registration will be enabled soon.`);
    }
  </script>
</body>
</html>
